if(k===0)return qMake('m1',i,1,'So sánh mô hình','Khác biệt cốt lõi giữa Bohr và mô hình hiện đại là gì?','Bohr dùng quỹ đạo xác định; hiện đại dùng phân bố xác suất',['Cả hai đều dùng quỹ đạo elip','Hiện đại bỏ mức năng lượng','Bohr không có hạt nhân'],'Điểm chuyển là từ quỹ đạo xác định sang vùng xác suất.','Quỹ đạo → xác suất.','Không phủ nhận hoàn toàn khái niệm mức năng lượng.',false);if(k===1)return qMake('m1',i,1,'AO 90%','Trong cách biểu diễn AO phổ thông, vùng AO thường bao quanh khoảng','90% xác suất hiện diện e',['10%','50%','100% chính xác'],'Tài liệu dùng cách hình dung AO là vùng không gian có xác suất hiện diện lớn, thường xấp xỉ 90%.','AO thường biểu diễn ~90% xác suất.','100% phải xét toàn không gian.',false);if(k===2)return qMake('m1',i,1,'Xác suất','Nếu hỏi nơi electron “chắc chắn tuyệt đối” có mặt theo mô hình lượng tử, lựa chọn đúng nhất là','toàn bộ không gian khả dĩ quanh hạt nhân',['chỉ một AO hữu hạn','một quỹ đạo tròn','trong hạt nhân'],'Một AO hữu hạn thường biểu diễn phần lớn xác suất, không phải 100% tuyệt đối.','100% → xét toàn không gian.','Không biến AO thành biên cứng.',false);if(k===3)return qMake('m1',i,1,'Hấp thụ năng lượng','Trong mô hình Bohr, khi electron hấp thụ năng lượng phù hợp, nó có thể','chuyển lên mức năng lượng cao hơn',['rơi xuống mức thấp hơn','đổi thành proton','mất spin'],'Hấp thụ năng lượng gắn với chuyển lên mức cao hơn.','Hấp thụ → lên mức.','Phát xạ mới gắn với đi xuống.',false);return qMake('m1',i,1,'Bản chất','Phát biểu nào phù hợp mô hình hiện đại?','Không thể gán đồng thời quỹ đạo xác định kiểu hành tinh cho electron',['Electron đứng yên trong AO','AO là đường đi bắt buộc','Mọi electron cùng năng lượng'],'Mô hình hiện đại mô tả xác suất chứ không dùng đường quỹ đạo xác định.','Không gian xác suất.','Không hiểu AO như “ống dẫn”.',false)}
function m2gen(i,adv){let k=i%5;if(!adv){if(k===0)return qMake('m2',i,0,'AO s','AO s có hình dạng','hình cầu',['số 8','elip','cánh hoa'],'Orbital s đối xứng cầu quanh hạt nhân.','s → cầu.','Không nhầm p với s.',false);if(k===1)return qMake('m2',i,0,'AO p','Phân lớp p có số AO là','3',['1','5','7'],'p gồm pₓ,pᵧ,p_z.','p → 3 AO.','Số AO không phải 6e.',false);if(k===2)return qMake('m2',i,0,'AO d','Phân lớp d có số AO là','5',['3','7','10'],'d có 5 orbital.','d → 5 AO.','10 là số electron tối đa.',false);if(k===3)return qMake('m2',i,0,'AO f','Phân lớp f có số AO là','7',['3','5','14'],'f có 7 orbital.','f → 7 AO.','14 là số electron tối đa.',false);return qMake('m2',i,0,'p định hướng','AO p định hướng theo trục y được kí hiệu','pᵧ',['pₓ','p_z','s'],'Tên pₓ,pᵧ,p_z phản ánh trục định hướng.','p theo trục tương ứng.','Không xem p là hình cầu.',false)}
if(k===0)return qMake('m2',i,1,'Suy từ số AO','Một phân lớp có 5 AO. Đó là phân lớp','d',['s','p','f'],'Dãy số AO s,p,d,f là 1,3,5,7.','1–3–5–7.','Không dùng sức chứa e để trả lời trực tiếp.',false);if(k===1)return qMake('m2',i,1,'Suy từ sức chứa','Một phân lớp có tối đa 14e. Số AO của nó là','7',['14','5','3'],'Mỗi AO tối đa 2e ⇒ 14/2=7 AO ⇒ f.','AO = e tối đa/2.','Quên mỗi AO chứa tối đa 2e.');if(k===2)return qMake('m2',i,1,'So sánh','Số AO của d nhiều hơn p bao nhiêu?','2',['1','4','5'],'d có 5 AO, p có 3 AO ⇒ hơn 2.','d−p=5−3.','Đừng dùng 10−6 electron.');if(k===3)return qMake('m2',i,1,'Kết hợp','Tổng số AO của s và p là','4',['3','6','8'],'1+3=4 AO.','s+p =1+3.','Không cộng sức chứa electron.');return qMake('m2',i,1,'Hình học','Điểm giống cơ bản của pₓ,pᵧ,p_z là','cùng dạng hai thùy và cùng mức năng lượng trong một phân lớp',['cùng hướng','khác số electron tối đa','một AO dạng cầu'],'Chúng khác hướng không gian nhưng cùng dạng và cùng năng lượng trong phân lớp p.','Cùng phân lớp → cùng mức năng lượng.','Không nhầm “cùng hướng” với “cùng dạng”.',false)}
function m3gen(i,adv){let n=1+(i%4);let k=i%5;if(!adv){if(k===0)return qMake('m3',i,0,'Số phân lớp',`Lớp n=${n} có bao nhiêu phân lớp?`,n,[Math.max(1,n-1),n+1,n*n],`Lớp thứ n có n phân lớp.`,'Số phân lớp = n.','Không dùng n².');if(k===1)return qMake('m3',i,0,'Số AO',`Lớp n=${n} có tối đa bao nhiêu AO?`,n*n,[2*n,n,2*n*n],`Tổng số AO trong lớp n là n²=${n*n}.`,'AO lớp n = n².','2n² là số electron tối đa.');if(k===2)return qMake('m3',i,0,'Số e tối đa',`Lớp n=${n} chứa tối đa bao nhiêu electron?`,2*n*n,[n*n,2*n,n],`e tối đa=2n²=${2*n*n}.`,'e max=2n².','Không dùng n².');if(k===3){let ss=['s','p','d','f'][n-1],e=[2,6,10,14][n-1];return qMake('m3',i,0,'Phân lớp',`Phân lớp ${ss} chứa tối đa bao nhiêu electron?`,e,[Math.max(2,e-2),e+2,n*n],`Phân lớp ${ss} có tối đa ${e}e.`,'s² p⁶ d¹⁰ f¹⁴.','Không nhầm số AO với số e.');}return qMake('m3',i,0,'Tên lớp',`Lớp n=${n} có tên`,['K','L','M','N'][n-1],[['K','L','M','N'][(n)%4],['K','L','M','N'][(n+1)%4],['K','L','M','N'][(n+2)%4]],`n=1,2,3,4 tương ứng K,L,M,N.`,'1→K,2→L,3→M,4→N.','Không bỏ qua chữ cái L.',false)}
if(k===0){let E=2*n*n;return qMake('m3',i,1,'Tư duy ngược',`Một lớp chứa tối đa ${E} electron. Số thứ tự lớp n là?`,n,[Math.max(1,n-1),n+1,n*n],`2n²=${E} ⇒ n²=${E/2} ⇒ n=${n}.`,'n=√(Emax/2).','Đừng lấy n=E/2.');}if(k===1){let ao=n*n;return qMake('m3',i,1,'Từ AO suy lớp',`Một lớp có tổng ${ao} orbital. Lớp đó có n bằng?`,n,[Math.max(1,n-1),n+1,2*n],`n²=${ao} ⇒ n=${n}.`,'n=√(số AO).','Nhầm AO với e tối đa.');}if(k===2){let p=1+(i%4),ao=2*p+1,e=2*ao;let letter=['s','p','d','f'][p];return qMake('m3',i,1,'Suy phân lớp',`Một phân lớp có ${ao} AO và tối đa ${e}e. Kí hiệu loại phân lớp là?`,letter,['s','p','d','f'].filter(x=>x!==letter).slice(0,3),`s,p,d,f có số AO lần lượt 1,3,5,7.`,'1–3–5–7 AO.','Không lấy số e làm chỉ số n.',false);}if(k===3){let a=n*n,b=2*n*n;return qMake('m3',i,1,'Kết hợp lớp',`Lớp n=${n}: số AO và số e tối đa lần lượt là?`,`${a} AO; ${b}e`,[`${b} AO; ${a}e`,`${n} AO; ${b}e`,`${a} AO; ${a}e`],`AO=n²=${a}; emax=2n²=${b}.`,'n² AO; 2n² e.','Đảo hai đại lượng.');}return qMake('m3',i,1,'Phân lớp hợp lệ',`Trong lớp n=${n}, phân lớp có thể có chỉ số từ l=0 đến l=n−1. Số loại phân lớp là?`,n,[n+1,Math.max(1,n-1),n*n],`Có đúng n giá trị l ⇒ n phân lớp.`,'Số phân lớp=n.','Không tính l=n.');}
function unpaired(sub,e){let ao={s:1,p:3,d:5,f:7}[sub];return e<=ao?e:2*ao-e}
function m4gen(i,adv){let k=i%5;if(!adv){if(k===0)return qMake('m4',i,0,'Pauli','Một AO hợp lệ tối đa có','2e spin ngược chiều',['2e cùng chiều','3e bất kỳ','1e duy nhất'],'Nguyên lí Pauli giới hạn 2e/AO và spin ngược.','Pauli: ↑↓.','↑↑ trong cùng AO là sai.',false);if(k===1)return qMake('m4',i,0,'Hund','Với 2p² ở trạng thái cơ bản, phân bố đúng là','[↑][↑][ ]',['[↑↓][ ][ ]','[↑↓][↑][ ]','[↑↑][ ][ ]'],'Hund yêu cầu điền độc thân vào các AO suy biến trước khi ghép đôi.','Hund: độc thân tối đa.','Không ghép đôi sớm.',false);if(k===2){let e=1+(i%6),u=unpaired('p',e);return qMake('m4',i,0,'e độc thân',`Phân lớp p có ${e} electron. Số electron độc thân ở trạng thái cơ bản là?`,u,[Math.max(0,u-1),u+1,e],`p có 3 AO. Điền theo Hund ⇒ ${u} electron độc thân.`,'p: 3 AO; đi đơn trước, ghép sau.','Đừng lấy số electron lẻ/chẵn trực tiếp.');}if(k===3)return qMake('m4',i,0,'Vững bền','Nguyên lí vững bền nói rằng electron ở trạng thái cơ bản','chiếm AO năng lượng thấp trước',['chiếm AO xa hạt nhân trước','ghép đôi ngay','chỉ điền lớp ngoài'],'Electron sắp theo mức năng lượng tăng dần.','Thấp → cao.','Không điền theo n đơn thuần.',false);return qMake('m4',i,0,'AO trống','Một AO chứa 0e được gọi là','AO trống',['AO độc thân','AO ghép đôi','AO bão hòa'],'0e = AO trống; 1e = độc thân; 2e = ghép đôi.','0/1/2e → trống/độc thân/ghép đôi.','Không gọi 1e là trống.',false)}
if(k===0){let e=1+(i%10),u=unpaired('d',e);return qMake('m4',i,1,'d electron',`Phân lớp d có ${e}e. Số electron độc thân là?`,u,[Math.max(0,u-1),Math.min(5,u+1),e],`d có 5 AO; theo Hund, u=${u}.`,'d: 5 AO; u=e nếu e≤5, u=10−e nếu e>5.','Không dùng quy tắc của p.');}if(k===1){let e=1+(i%14),u=unpaired('f',e);return qMake('m4',i,1,'f electron',`Phân lớp f có ${e}e. Số electron độc thân là?`,u,[Math.max(0,u-1),Math.min(7,u+1),e],`f có 7 AO; phân bố độc thân tối đa trước khi ghép.`,'f: 7 AO.','Không coi 14 AO.');}if(k===2)return qMake('m4',i,1,'Kiểm tra Pauli','Cấu hình ô nào chắc chắn sai vì Pauli?','[↑↑]',['[↑↓]','[↑]','[ ]'],'Hai electron trong cùng AO không được cùng spin.','1 AO ≤2e spin ngược.','Hund không phải lý do chính ở đây.',false);if(k===3)return qMake('m4',i,1,'Hund + Pauli','Với p⁴, dạng khái quát đúng là','[↑↓][↑][↑]',['[↑↓][↑↓][ ]','[↑↑][↑][↑]','[↑↓][↓][ ]'],'Ba AO được điền đơn trước, electron thứ 4 mới ghép đôi.','p⁴ → 2 e độc thân.','Ghép đôi ở hai AO và bỏ trống AO thứ ba.',false);return qMake('m4',i,1,'Suy ngược',`Một phân lớp d có 4 electron độc thân và tổng 6 electron. Cách phân bố phù hợp?`,'d⁶',['d⁴','d⁵','d⁸'],'d⁶ sau khi 5 AO mỗi AO có 1e, electron thứ 6 ghép vào một AO ⇒ còn 4 độc thân.','d⁶ → 4 độc thân.','Chỉ nhìn số độc thân có thể có d⁴; cần dùng cả tổng e.');}
const order=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s'];const cap={s:2,p:6,d:10,f:14};function config(z){let rem=z,a=[];for(const o of order){let c=cap[o.slice(-1)],x=Math.min(c,rem);if(x>0)a.push(o+(x===1?'¹':x===2?'²':x===3?'³':x===4?'⁴':x===5?'⁵':x===6?'⁶':x===7?'⁷':x===8?'⁸':x===9?'⁹':'¹⁰'));rem-=x;if(rem<=0)break}return a.join(' ')}
function m5gen(i,adv){let k=i%5,z=3+(i%16);if(!adv){if(k===0)return qMake('m5',i,0,'Thứ tự NL','Phân lớp nào được điền trước trong trạng thái cơ bản?','4s trước 3d',['3d trước 4s','4p trước 3d','3p trước 3s'],'Theo dãy năng lượng, 4s thấp hơn 3d nên được điền trước.','…3p < 4s < 3d < 4p…','Không điền hoàn toàn theo n.',false);if(k===1)return qMake('m5',i,0,'Cấu hình',`Nguyên tử trung hòa có Z=${z}. Tổng số electron cần phân bố là?`,z,[z-1,z+1,2*z],`Nguyên tử trung hòa có e=Z=${z}.`,'e=Z.','Không dùng số neutron.');if(k===2){let c=config(z);return qMake('m5',i,0,'Cấu hình e',`Cấu hình electron trạng thái cơ bản của Z=${z} là?`,c,[config(Math.max(1,z-1)),config(z+1),config(Math.max(1,z-2))],`Điền ${z} electron theo thứ tự mức năng lượng và sức chứa AO.`,'Điền thấp→cao, đúng sức chứa.','Dừng quá sớm hoặc thừa electron.');}if(k===3)return qMake('m5',i,0,'Dãy NL','Đoạn thứ tự nào đúng?','3s < 3p < 4s < 3d',['3s < 4s < 3p < 3d','3p < 3s < 3d < 4s','4s < 3p < 3s < 3d'],'Đây là phần quan trọng của dãy Klechkovski trong chương trình.','3p < 4s < 3d.','Không đặt 3d trước 4s.',false);return qMake('m5',i,0,'Cấu hình lớp','Cấu hình bão hòa của phân lớp p là','p⁶',['p²','p³','p¹⁰'],'p có 3 AO ×2e=6e.','p⁶.','Không nhầm số AO=3 với số e=6.',false)}
if(k===0){let z2=11+(i%8),c=config(z2);return qMake('m5',i,1,'Suy từ Z',`Z=${z2}. Cấu hình đúng là?`,c,[config(z2-1),config(z2+1),config(z2-2)],`Tổng electron=${z2}; điền tuần tự.`,'Tổng số mũ phải bằng Z.','Chọn cấu hình có tổng electron khác Z.');}if(k===1)return qMake('m5',i,1,'Phân mức cuối','Cấu hình 1s² 2s² 2p⁶ 3s² 3p⁴ có phân lớp đang chứa electron cuối cùng là','3p',['3s','2p','4s'],'Electron cuối nằm ở 3p theo cấu hình đã cho.','Nhìn phân lớp cuối có electron.','Không nhầm với lớp ngoài cùng chỉ n=3.',false);if(k===2)return qMake('m5',i,1,'Tổng electron','Tổng số electron trong 1s² 2s² 2p⁶ 3s² 3p⁵ là','17',['15','16','18'],'Cộng số mũ:2+2+6+2+5=17.','Z=Σ số mũ.','Không cộng hệ số n.');if(k===3)return qMake('m5',i,1,'Klechkowski','Sau phân lớp 3p trong dãy mức năng lượng là','4s',['3d','4p','5s'],'Dãy: …3s <3p <4s <3d…','3p→4s→3d.','Thói quen “cùng lớp trước” dễ gây sai.',false);return qMake('m5',i,1,'Kiểm cấu hình','Cấu hình nào vi phạm sức chứa phân lớp?','2p⁷',['2p⁶','3d¹⁰','4f¹⁴'],'p chỉ có 3 AO nên tối đa 6e.','s² p⁶ d¹⁰ f¹⁴.','Không vượt sức chứa.',false)}
function m6gen(i,adv){let k=i%5;if(!adv){if(k===0){let shell2=1+(i%8),z=2+shell2;return qMake('m6',i,0,'Phân bố lớp',`Nguyên tử có 2e ở lớp K và ${shell2}e ở lớp L. Tổng electron là?`,z,[shell2,z+1,z-1],`Tổng e=2+${shell2}=${z}.`,'Tổng e = tổng electron mọi lớp.','Không lấy lớp ngoài làm tổng.');}if(k===1)return qMake('m6',i,0,'Lớp ngoài','Nguyên tử có cấu hình lớp 2,8,3. Lớp ngoài cùng có','3e',['8e','13e','2e'],'Lớp ngoài cùng là lớp thứ 3 và có 3 electron.','Lớp ngoài cùng = n lớn nhất có e.','Không lấy 8e lớp bão hòa bên trong.',false);if(k===2)return qMake('m6',i,0,'Số lớp','Phân bố electron theo lớp là 2,8,7. Nguyên tử có bao nhiêu lớp electron?','3',['2','7','17'],'Có ba lớp chứa electron.','Số lớp = số lớp có e.','Không dùng số e lớp ngoài.');if(k===3)return qMake('m6',i,0,'Nhận diện','Nguyên tử có tổng 8 electron. Số hiệu nguyên tử Z là','8',['6','10','16'],'Nguyên tử trung hòa: Z=e=8.','Z=e.','Không nhân đôi electron.');return qMake('m6',i,0,'M lớp','Lớp M có các phân lớp','3s,3p,3d',['3s,3p','4s,4p,4d','2s,2p'],'n=3 ⇒ có 3 phân lớp s,p,d.','M↔n=3.','Không đưa 3f vào.',false)}
if(k===0){let outer=1+(i%6),z=10+outer;return qMake('m6',i,1,'Tư duy ngược',`Một nguyên tử có 3 lớp electron; hai lớp trong bão hòa 2e và 8e, lớp ngoài có ${outer}e. Z bằng?`,z,[outer,10,10+Math.max(1,outer-1)],`Tổng e=2+8+${outer}=${z}; nguyên tử trung hòa ⇒ Z=${z}.`,'Đáp án Z ← tổng e ← phân bố lớp.','Đừng lấy e lớp ngoài làm Z.');}if(k===1){let z=13,A=27,N=A-z;return qMake('m6',i,1,'Lớp vỏ + hạt nhân',`A có 3 lớp electron và 3e lớp ngoài; theo phân bố cơ bản suy Z=13. Nếu số khối A=27, số neutron là?`,N,[13,27,10],`2+8+3=13e ⇒ Z=13; N=27−13=${N}.`,'N ← A−Z ← Z từ tổng e.','Không lấy A−e lớp ngoài.');}if(k===2)return qMake('m6',i,1,'Phân lớp cuối','Nguyên tử có cấu hình 1s²2s²2p⁶3s²3p³. Lớp ngoài cùng và số e lớp ngoài lần lượt là','n=3 và 5e',['n=3 và 3e','n=2 và 8e','n=3 và 15e'],'Ở n=3 có 3s²3p³ ⇒ 5e lớp ngoài.','Cộng mọi phân lớp cùng n lớn nhất.','Không chỉ lấy số e của phân lớp cuối.');if(k===3)return qMake('m6',i,1,'e độc thân tổng hợp','Cấu hình 1s²2s²2p⁴ có số electron độc thân là','2',['0','1','4'],'2p⁴ phân bố [↑↓][↑][↑] ⇒ 2 độc thân.','Dùng Hund trên phân lớp chưa bão hòa.','Không đếm các electron ghép đôi.');return qMake('m6',i,1,'Phân biệt khái niệm','“Lớp ngoài cùng” và “phân lớp điền cuối” có thể khác nhau rõ nhất khi','có sự xen kẽ mức năng lượng như 4s và 3d',['chỉ có lớp K','phân lớp s bão hòa','nguyên tử có 2e'],'Dãy năng lượng có 4s trước 3d, vì vậy phân lớp điền cuối không luôn trùng lớp n lớn nhất.','Phân biệt n lớn nhất với mức năng lượng cuối.','Không đồng nhất hai khái niệm.',false)}
const gens={m1:m1gen,m2:m2gen,m3:m3gen,m4:m4gen,m5:m5gen,m6:m6gen};let BANK=[];function genBank(){BANK=[];for(const m of modules){for(let i=0;i<50;i++)BANK.push(gens[m.id](i,false));for(let i=0;i<50;i++)BANK.push(gens[m.id](i,true))}}
let quiz={list:[],idx:0,sel:null,checked:false,title:''};function startModule(id,mode){let arr=BANK.filter(q=>q.module===id&&(mode==='all'||(mode==='basic'?q.level==='Cơ bản':q.level==='Nâng cao')));quiz={list:arr,idx:0,sel:null,checked:false,title:modules.find(x=>x.id===id).title};navQuiz()}function startSource(setn){let arr=SOURCE.filter(x=>x.set===setn).map(sourceToQ);quiz={list:arr,idx:0,sel:null,checked:false,title:setn};navQuiz()}function navQuiz(){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-quiz').classList.add('active');$$('.nav').forEach(x=>x.classList.remove('active'));renderQuiz();scrollTo({top:0})}
function moduleIdForSource(q){let t=q.text.toLowerCase();if(/mô hình|orbital nguyên tử|xác suất|rutherford|bohr|hiện đại/.test(t))return 'm1';if(/hình cầu|số tám|pₓ|pᵧ|p_z|orbital s|orbital p/.test(t))return 'm2';if(/bao nhiêu phân lớp|tối đa bao nhiêu electron|số orbital|2n²|lớp m|lớp n|phân lớp 3d|phân lớp 2p|bão hòa|s, p, d, f/.test(t))return 'm3';if(/pauli|hund|ô orbital|electron độc thân|spin|phân bố electron/.test(t))return 'm4';if(/thứ tự|mức năng lượng|cấu hình electron|4s|3d/.test(t))return 'm5';return 'm6'}
function sourceCalc(q){let m=moduleIdForSource(q),t=q.text.toLowerCase();return ['m3','m4','m5','m6'].includes(m)&&/bao nhiêu|số lượng|tối đa|cấu hình|độc thân|tổng|z=/.test(t)}function sourceToQ(x){let mid=moduleIdForSource(x),m=modules.find(v=>v.id===mid);return {...x,module:mid,level:x.set==='Ôn tập gốc'?'Ôn tập':'Tự luyện',source:'Bám sát file LIVE 3 – Cấu trúc lớp vỏ electron',rule:m.formula,expl:`Quay về quy tắc lõi của dạng “${m.title}”: ${m.memory}`,trap:m.trap,calc:sourceCalc(x)}}
function reverseThinking(q){const m=q.module;if(m==='m3')return{goal:'Tìm số phân lớp, số AO hoặc số electron tối đa.',chain:'Đáp án ← 2n² hoặc n² hoặc n ← số thứ tự lớp / sức chứa đề cho',steps:['Xác định đại lượng đề hỏi: phân lớp, AO hay electron.','Chọn đúng quan hệ n; n²; 2n².','Kiểm kết quả bằng lớp K,L,M,N quen thuộc.'],trap:'n² là số AO, còn 2n² là số electron tối đa.'};if(m==='m4')return{goal:'Tìm số electron độc thân/cách điền orbital đúng.',chain:'Số e độc thân ← sơ đồ AO sau Hund ← số electron trong phân lớp ← dữ kiện',steps:['Xác định số AO của phân lớp.','Đi 1 electron vào mỗi AO trước.','Electron còn lại mới ghép đôi; đồng thời kiểm Pauli.'],trap:'Ghép đôi sớm sẽ làm giảm số electron độc thân.'};if(m==='m5')return{goal:'Viết/kiểm cấu hình electron.',chain:'Cấu hình đúng ← phân bố đủ Z electron ← thứ tự mức NL + sức chứa ← Z hoặc tổng e',steps:['Tính tổng electron cần điền.','Đi theo 1s→2s→2p→3s→3p→4s→3d…','Cộng lại số mũ để kiểm đúng tổng e.'],trap:'4s được điền trước 3d trong thứ tự năng lượng cơ bản.'};if(m==='m6')return{goal:'Suy nguyên tố hoặc hạt nhân từ mô tả lớp vỏ.',chain:'Đại lượng cuối ← Z ← tổng số electron ← electron từng lớp/phân lớp',steps:['Cộng đúng toàn bộ electron.','Nguyên tử trung hòa: Z=e.','Nếu hỏi neutron: N=A−Z sau cùng.'],trap:'Không dùng riêng electron lớp ngoài để thay cho Z.'};return{goal:'Nhận diện bản chất mô hình/orbital.',chain:'Kết luận ← dấu hiệu khái niệm ← mô hình/định nghĩa trong đề',steps:['Gạch từ khóa: quỹ đạo hay xác suất.','Xác định đang nói mô hình Bohr hay lượng tử.','Loại phương án trộn hai mô hình.'],trap:'Orbital không phải quỹ đạo.'}}
function analysisHTML(q){if(!q.calc)return'';let r=reverseThinking(q);return `<details class="analysisBox" open><summary>🧠 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đề đang hỏi gì?</h4><p>${r.goal}</p><h4>2. Dữ kiện quyết định</h4><p>${q.rule||modules.find(m=>m.id===q.module)?.formula}</p></div><div class="analysisCard reverse"><h4>↩ Tư duy ngược</h4><div class="analysisArrow">${r.chain}</div><ol class="analysisSteps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></div><div class="analysisHint"><b>Bẫy cần kiểm:</b> ${r.trap}</div></div></details>`}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){nav('home');return}let src=q.source?'<span class="tag amber">Từ file</span>':'';$('#v-quiz').innerHTML=`<div class="qwrap"><div class="pagehead"><div><h2>${esc(quiz.title)}</h2><p>Câu ${quiz.idx+1}/${quiz.list.length} · Enter để kiểm tra/chuyển câu</p></div><button class="btn secondary" onclick="nav('practice')">← Thoát</button></div><div class="card"><div class="qmeta"><span class="tag blue">${esc(q.level||'Luyện tập')}</span>${src}<span class="tag purple">${esc(modules.find(m=>m.id===q.module)?.title||'')}</span></div><div class="qtext">${esc(q.text)}</div>${analysisHTML(q)}<div id="opts">${(q.opts||[]).map((o,i)=>`<button class="opt ${quiz.sel===i?'sel':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div><div class="actionsRow"><button class="btn secondary" ${quiz.idx===0?'disabled':''} onclick="move(-1)">← Trước</button><div style="display:flex;gap:8px"><button class="btn primary" id="checkBtn" onclick="check()">Kiểm tra</button><button class="btn secondary" onclick="move(1)">Sau →</button></div></div></div></div>`}
function choose(i){if(quiz.checked)return;quiz.sel=i;renderQuiz()}function correctIndex(q){return q.a}function check(){let q=quiz.list[quiz.idx];if(quiz.checked){move(1);return}if(quiz.sel===null){toast('Chọn một đáp án trước');return}quiz.checked=true;let ci=correctIndex(q),ok=quiz.sel===ci;st.attempted++;if(ok){st.correct++;st.xp+=10}else{st.xp+=2;if(!st.wrong.some(x=>x.id===q.id))st.wrong.push({...q,chosen:quiz.sel})}let mid=q.module,old=st.done[mid]||0;st.done[mid]=Math.min(100,old+(ok?2:0.5));save();updateTop();$$('.opt').forEach((b,i)=>{if(i===ci)b.classList.add('ok');if(i===quiz.sel&&!ok)b.classList.add('bad');b.disabled=true});let chosen=q.opts[quiz.sel],correct=q.opts[ci];$('#fb').innerHTML=`<div class="feedback ${ok?'explain':'warning'}"><h3>${ok?'✓ Chính xác':'✗ Chưa đúng'}</h3><div class="answerCompare"><div class="answerPill ${ok?'good':'bad'}"><b>Em chọn</b><br>${esc(chosen)}</div><div class="answerPill good"><b>Đáp án đúng</b><br>${esc(correct)}</div></div><p><b>Vì sao?</b> ${esc(q.expl||q.rule)}</p><p><b>Công thức / quy tắc:</b> ${esc(q.rule||'')}</p><p><b>Bẫy dễ sai:</b> ${esc(q.trap||'')}</p>${!ok?`<button class="btn purpleBtn" onclick="openGap('${q.module}')">Mở chuỗi 5 câu tìm lỗ hổng</button>`:''}</div>`;$('#checkBtn').textContent='Câu tiếp →'}
function move(d){let ni=quiz.idx+d;if(ni<0)return;if(ni>=quiz.list.length){toast('Đã hết bộ câu hỏi');nav('report');return}quiz.idx=ni;quiz.sel=null;quiz.checked=false;renderQuiz();scrollTo({top:0})}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();check()}})
function openGap(mid){let m=modules.find(x=>x.id===mid);let qs=[`Điều đầu tiên cần nhận diện trong dạng “${m.title}” là gì?`,`Công thức/quy tắc lõi nào phải bật ra trước?`,`Dữ kiện nào trong đề là dữ kiện quyết định?`,`Bẫy nào dễ khiến em chọn sai?`,`Nếu đổi số liệu nhưng giữ bản chất, em sẽ làm bước đầu tiên nào?`];openModal(`<h2>Chuỗi tìm lỗ hổng · ${m.title}</h2><p class="muted">Trả lời từng câu bằng chính kiến thức vừa sai.</p>${qs.map((x,i)=>`<div class="wrongitem"><b>Bước ${i+1}/5</b><p>${x}</p><input style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px" placeholder="Tự trả lời trước khi xem gợi ý"><details><summary>Gợi ý</summary><p>${i===1?m.formula:i===3?m.trap:m.memory}</p></details></div>`).join('')}`)}
function renderWrong(){let a=st.wrong;$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Mỗi lỗi được giữ lại để quay về đúng quy tắc.</p></div><button class="btn secondary" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${a.length?a.map((q,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><h3>${esc(q.text)}</h3><p><b>Quy tắc cần ôn:</b> ${esc(q.rule||'')}</p><button class="btn purpleBtn" onclick="openGap('${q.module}')">Tìm lỗ hổng</button></div>`).join(''):'<div class="card"><h3>Chưa có câu sai 🎯</h3><p class="muted">Làm bài để hệ thống tự xây sổ lỗi.</p></div>'}`}
function renderReport(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Dữ liệu lưu ngay trên trình duyệt bằng localStorage.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai cần ôn</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${m.icon} ${m.title}</b><span>${Math.round(st.done[m.id]||0)}%</span></div><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div></div>`).join('')}</div>`}
genBank();updateTop();renderHome();
</script></body></html>
